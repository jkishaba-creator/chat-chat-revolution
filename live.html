<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat Chat Revolution — Live</title>
<meta name="description" content="Live chat-controlled dodging game. Type l, r, u or d in the stream chat to move." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <span class="brand__jp" lang="ja">瓦落とし</span>
        <span class="brand__en">Live</span>
      </div>
      <dl class="hud" aria-label="Match status">
        <div class="hud__cell">
          <dt>Round</dt>
          <dd id="hud-round">1</dd>
        </div>
        <div class="hud__cell">
          <dt>Alive</dt>
          <dd><span id="hud-alive">0</span><span class="hud__slash">/</span><span id="hud-total">0</span></dd>
        </div>
        <div class="hud__cell hud__cell--wide">
          <dt>Phase</dt>
          <dd id="hud-phase">Connecting</dd>
        </div>
      </dl>
    </header>

    <main class="stage">
      <section class="board" aria-labelledby="board-heading">
        <h2 id="board-heading" class="sr-only">Live game board</h2>
        <div class="board__timer">
          <span class="board__timer-text" id="timer-text">Connecting</span>
          <span class="board__timer-track"><span class="board__timer-fill" id="timer-fill"></span></span>
        </div>
        <div class="board__canvas-wrap">
          <canvas id="game" width="416" height="300" role="img" aria-labelledby="board-heading" aria-describedby="board-alt"></canvas>
        </div>
        <p id="board-alt" class="sr-only">Waiting for the live board.</p>
        <p class="board__hint">
          Type <b>l</b> <b>r</b> <b>u</b> <b>d</b> in the stream chat to move. First message joins you.
          Grid is <b>A–K</b> across, <b>1–7</b> down.
        </p>
      </section>

      <section class="chat" aria-labelledby="chat-heading">
        <div class="chat__head">
          <h2 id="chat-heading">Live chat</h2>
          <p class="chat__legend" id="source-status">Connecting to the chat bridge…</p>
        </div>
        <ol class="chat__log" id="chat-log" aria-label="Live chat messages"></ol>
        <dl class="hud hud--stack" aria-label="Bridge statistics">
          <div class="hud__cell">
            <dt>Commands</dt>
            <dd id="stat-commands">0</dd>
          </div>
          <div class="hud__cell">
            <dt>Queued</dt>
            <dd id="stat-waiting">0</dd>
          </div>
          <div class="hud__cell">
            <dt>Quota</dt>
            <dd id="stat-quota">—</dd>
          </div>
        </dl>
      </section>
    </main>

    <p class="announcer sr-only" id="announcer" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="src/live.js"></script>
</body>
</html>
